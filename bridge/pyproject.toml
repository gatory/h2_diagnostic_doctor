[project]
name = "h2-bridge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gatory", email = "kuandev06@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cyclonedds==0.10.2",
    "rich>=15.0.0",
    "unitree-sdk2py",
    "websockets>=15",
]

[project.scripts]
h2-doctor = "h2_bridge.__main__:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
unitree-sdk2py = { path = "../../unitree_sdk2_python", editable = false }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
